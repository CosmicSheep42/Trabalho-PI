services:
  ollama:
    image: ollama/ollama:latest
    container_name: Ollama_PI
    restart: always
    entrypoint:
      - /bin/sh
      - /usr/local/bin/ollama-bootstrap.sh
    ports:
      - "11435:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      GENERATION_MODEL: ${GENERATION_MODEL}
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-bootstrap.sh:/usr/local/bin/ollama-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${GENERATION_MODEL}'"]
      interval: 10s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.0
    container_name: MySQL_PI
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: Backend_PI
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: Frontend_PI
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - .env
    stdin_open: true
    tty: true

volumes:
  mysql_data:
    name: trabalho-pi_mysql_data
  ollama_data:
    name: trabalho-pi_ollama_data
